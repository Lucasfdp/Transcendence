services:
    reverse_proxy:
        build:
            context: ./infra/reverse-proxy
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_reverse_proxy
        image: ${COMPOSE_PROJECT_NAME}/reverse_proxy:local
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - ./secrets/nginx_ssl:/etc/nginx/ssl
            - logs:/var/log/nginx
        networks:
            - frontend_network
        depends_on:
            frontend:
                condition: service_healthy
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        environment:
            - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
            - MONITORING_PORT=${MONITORING_PORT:-3001}
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                - FRONTEND_ENV=${FRONTEND_ENV:-development}
                - VITE_API_URL=${VITE_API_URL:-/api}
                - VITE_GITHUB_AUTH_URL=${VITE_GITHUB_AUTH_URL:-}
        container_name: ${COMPOSE_PROJECT_NAME}_frontend
        image: ${COMPOSE_PROJECT_NAME}/frontend:local
        restart: unless-stopped
        expose:
            - "${FRONTEND_PORT:-3000}"
        volumes:
            - logs:/var/log/frontend
        networks:
            - frontend_network
        environment:
            - NODE_ENV=${FRONTEND_ENV:-development}
            - VITE_API_URL=${VITE_API_URL:-/api}
            - VITE_GITHUB_AUTH_URL=${VITE_GITHUB_AUTH_URL:-}
            - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:${FRONTEND_PORT:-3000}/",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            args:
                - BACKEND_ENV=${BACKEND_ENV:-development}
        container_name: ${COMPOSE_PROJECT_NAME}_backend
        image: ${COMPOSE_PROJECT_NAME}/backend:local
        restart: unless-stopped
        expose:
            - "${BACKEND_PORT:-8000}"
        volumes:
            - logs:/var/log/backend
            - backend_vault_rendered:/vault/secrets:ro
        networks:
            - frontend_network
            - backend_network
        depends_on:
            backend_vault_agent:
                condition: service_healthy
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            - NODE_ENV=${BACKEND_ENV:-development}
            - APP_ENV=${BACKEND_ENV:-development}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost}
            - POSTGRES_HOST=database
            - POSTGRES_PORT=${POSTGRES_PORT:-5432}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - REDIS_HOST=redis
            - REDIS_PORT=${REDIS_PORT:-6379}
            - JWT_EXPIRY=${JWT_EXPIRY:-3600}
            - ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}
            - FORTYTWO_CALLBACK_URL=${FORTYTWO_CALLBACK_URL:-}
            - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
            - VAULT_ENV_FILE=/vault/secrets/backend.env
            - SECRETS_WAIT_TIMEOUT=${SECRETS_WAIT_TIMEOUT:-120}
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:${BACKEND_PORT:-8000}/api/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    database:
        build:
            context: ./infra/database
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_database
        image: ${COMPOSE_PROJECT_NAME}/database:local
        restart: unless-stopped
        volumes:
            - db_data:/var/lib/postgresql/data
            - logs:/var/log/postgresql
            - database_vault_rendered:/vault/secrets:ro
        networks:
            - backend_network
        depends_on:
            database_vault_agent:
                condition: service_healthy
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS:---encoding=UTF8}
            - POSTGRES_PASSWORD_FILE=/vault/secrets/postgres_password
            - SECRETS_WAIT_TIMEOUT=${SECRETS_WAIT_TIMEOUT:-120}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    redis:
        build:
            context: ./infra/redis
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_redis
        image: ${COMPOSE_PROJECT_NAME}/redis:local
        restart: unless-stopped
        expose:
            - "${REDIS_PORT:-6379}"
        volumes:
            - redis_data:/data
            - redis_vault_rendered:/vault/secrets:ro
        networks:
            - backend_network
        depends_on:
            redis_vault_agent:
                condition: service_healthy
        environment:
            - REDIS_PASSWORD_FILE=/vault/secrets/redis_password
            - REDIS_MAX_MEMORY=${REDIS_MAX_MEMORY:-256mb}
            - REDIS_MAX_MEMORY_POLICY=${REDIS_MAX_MEMORY_POLICY:-allkeys-lru}
            - SECRETS_WAIT_TIMEOUT=${SECRETS_WAIT_TIMEOUT:-120}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "redis-cli -a \"$(cat /vault/secrets/redis_password)\" ping | grep PONG",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    monitoring:
        build:
            context: ./infra/monitoring
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_monitoring
        image: ${COMPOSE_PROJECT_NAME}/monitoring:local
        restart: unless-stopped
        # Grafana is proxied through Nginx — do not expose directly on host
        expose:
            - "${MONITORING_PORT:-3001}"
        volumes:
            - monitoring_data:/var/lib/monitoring
            - logs:/var/log/monitoring
            - monitoring_vault_rendered:/vault/secrets:ro
        networks:
            - frontend_network
            - backend_network
        depends_on:
            monitoring_vault_agent:
                condition: service_healthy
            backend:
                condition: service_healthy
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            - GF_ADMIN_USER=${GF_ADMIN_USER:-admin}
            - PROMETHEUS_SCRAPE_INTERVAL=${PROMETHEUS_SCRAPE_INTERVAL:-15s}
            - MONITORING_PORT=${MONITORING_PORT:-3001}
            - VAULT_ENV_FILE=/vault/secrets/monitoring.env
            - SECRETS_WAIT_TIMEOUT=${SECRETS_WAIT_TIMEOUT:-120}
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:${MONITORING_PORT:-3001}/api/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    vault:
        build:
            context: ./infra/vault
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_vault
        image: ${COMPOSE_PROJECT_NAME}/vault:local
        restart: unless-stopped
        expose:
            - "8200"
        cap_add:
            - IPC_LOCK
        command: server
        environment:
            - VAULT_ADDR=http://127.0.0.1:8200
        volumes:
            - vault_data:/vault/file
            - ./infra/vault/policies:/vault/policies:ro
        networks:
            - backend_network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "vault status >/dev/null 2>&1; code=$$?; [ \"$$code\" = 0 ] || [ \"$$code\" = 2 ]",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        logging:
            driver: "${LOG_DRIVER:-json-file}"
            options:
                max-size: "${LOG_MAX_SIZE:-10m}"
                max-file: "${LOG_MAX_FILE:-3}"

    backend_vault_agent:
        build:
            context: ./infra/vault-agent
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_backend_vault_agent
        image: ${COMPOSE_PROJECT_NAME}/vault-agent:local
        restart: unless-stopped
        entrypoint: ["vault"]
        command: ["agent", "-config=/vault/config/backend.hcl"]
        depends_on:
            vault:
                condition: service_started
        volumes:
            - ./infra/vault-agent/config:/vault/config:ro
            - ./infra/vault-agent/templates:/vault/templates:ro
            - ./secrets/vault/approle/backend:/vault/bootstrap:ro
            - backend_vault_rendered:/vault/rendered
        networks:
            - backend_network
        healthcheck:
            test: ["CMD-SHELL", "[ -s /vault/rendered/backend.env ]"]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 5s

    database_vault_agent:
        build:
            context: ./infra/vault-agent
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_database_vault_agent
        image: ${COMPOSE_PROJECT_NAME}/vault-agent:local
        restart: unless-stopped
        entrypoint: ["vault"]
        command: ["agent", "-config=/vault/config/database.hcl"]
        depends_on:
            vault:
                condition: service_started
        volumes:
            - ./infra/vault-agent/config:/vault/config:ro
            - ./infra/vault-agent/templates:/vault/templates:ro
            - ./secrets/vault/approle/database:/vault/bootstrap:ro
            - database_vault_rendered:/vault/rendered
        networks:
            - backend_network
        healthcheck:
            test: ["CMD-SHELL", "[ -s /vault/rendered/postgres_password ]"]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 5s

    redis_vault_agent:
        build:
            context: ./infra/vault-agent
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_redis_vault_agent
        image: ${COMPOSE_PROJECT_NAME}/vault-agent:local
        restart: unless-stopped
        entrypoint: ["vault"]
        command: ["agent", "-config=/vault/config/redis.hcl"]
        depends_on:
            vault:
                condition: service_started
        volumes:
            - ./infra/vault-agent/config:/vault/config:ro
            - ./infra/vault-agent/templates:/vault/templates:ro
            - ./secrets/vault/approle/redis:/vault/bootstrap:ro
            - redis_vault_rendered:/vault/rendered
        networks:
            - backend_network
        healthcheck:
            test: ["CMD-SHELL", "[ -s /vault/rendered/redis_password ]"]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 5s

    monitoring_vault_agent:
        build:
            context: ./infra/vault-agent
            dockerfile: Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_monitoring_vault_agent
        image: ${COMPOSE_PROJECT_NAME}/vault-agent:local
        restart: unless-stopped
        entrypoint: ["vault"]
        command: ["agent", "-config=/vault/config/monitoring.hcl"]
        depends_on:
            vault:
                condition: service_started
        volumes:
            - ./infra/vault-agent/config:/vault/config:ro
            - ./infra/vault-agent/templates:/vault/templates:ro
            - ./secrets/vault/approle/monitoring:/vault/bootstrap:ro
            - monitoring_vault_rendered:/vault/rendered
        networks:
            - backend_network
        healthcheck:
            test: ["CMD-SHELL", "[ -s /vault/rendered/monitoring.env ]"]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 5s

volumes:
    db_data:
    redis_data:
    monitoring_data:
    logs:
    vault_data:
    backend_vault_rendered:
    database_vault_rendered:
    redis_vault_rendered:
    monitoring_vault_rendered:

networks:
    frontend_network:
    backend_network:
