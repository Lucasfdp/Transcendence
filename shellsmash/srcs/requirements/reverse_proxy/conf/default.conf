# ==============================================================================
# ft_transcendence — Nginx Virtual Host Configuration
# ==============================================================================
# Traffic flow:
#   Browser → :443 (HTTPS) → Nginx → frontend | backend | websocket
#   Browser → :80  (HTTP)  → Nginx → 301 redirect to HTTPS
#
# Routing rules:
#   /           → frontend service (SPA)
#   /api/       → backend REST API
#   /ws/        → backend WebSocket endpoint
#   /admin/     → backend admin panel (restrict in production)
#   /metrics/   → monitoring (restrict to internal IPs in production)
# ==============================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS permanently.
    # Change 301 to 302 temporarily during certificate provisioning.
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name localhost;  # Replace with $DOMAIN_NAME in production

    # --------------------------------------------------------------------------
    # TLS Configuration
    # --------------------------------------------------------------------------
    # Development: self-signed certificate generated by the Dockerfile
    # Production:  replace paths with Let's Encrypt certificates
    #              ssl_certificate     /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
    #              ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Only allow TLS 1.2 and 1.3 (42 project requirement: TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suite (prefer server order)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Session caching — zone declared by Alpine's nginx.conf at http level
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (requires a real CA-issued certificate)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Adjust Content-Security-Policy as needed when the frontend is configured.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://localhost;" always;

    # --------------------------------------------------------------------------
    # Static files (served directly by Nginx for performance)
    # --------------------------------------------------------------------------
    root /var/www/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Frontend SPA routing
    # --------------------------------------------------------------------------
    # All requests that don't match /api/ or /ws/ are forwarded to the frontend.
    # The frontend service handles client-side routing (React Router / Vue Router).
    # --------------------------------------------------------------------------
    location / {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;

        # SPA fallback: serve index.html for unknown paths
        # (only needed if Nginx serves the built static files directly)
        # try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Backend REST API
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;

        # Rate limiting (define zone in http block, uncomment here)
        # limit_req zone=api burst=20 nodelay;

        # Body size limit (adjust for file upload endpoints)
        client_max_body_size 10m;
    }

    # --------------------------------------------------------------------------
    # WebSocket upgrade
    # --------------------------------------------------------------------------
    # Required for real-time features: live game state, chat, notifications.
    # The Upgrade and Connection headers must be forwarded explicitly.
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket connections can be long-lived
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Future: Game WebSocket (if a dedicated game_service is added)
    # --------------------------------------------------------------------------
    # location /ws/game/ {
    #     proxy_pass         http://game_service:8001;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    #     proxy_read_timeout 3600s;
    # }

    # --------------------------------------------------------------------------
    # Future: Chat WebSocket
    # --------------------------------------------------------------------------
    # location /ws/chat/ {
    #     proxy_pass         http://chat_service:8002;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    # }

    # --------------------------------------------------------------------------
    # Admin panel (restrict by IP in production)
    # --------------------------------------------------------------------------
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Restrict admin access to localhost / VPN range
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;
    }

    # --------------------------------------------------------------------------
    # Monitoring dashboard (protect with basic auth or IP restriction)
    # --------------------------------------------------------------------------
    # location /grafana/ {
    #     proxy_pass         http://monitoring:3000/;
    #     proxy_set_header   Host              $host;
    # }

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
