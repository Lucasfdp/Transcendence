<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Shell Smash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #1a1410; overflow: hidden; }
    /* Pin the game host to the viewport so Phaser always measures the parent
       from the viewport, never from the canvas. */
    #game { position: fixed; inset: 0; }
    /* The canvas fills the host via CSS so its *display* size always equals the
       viewport. JS (shared/hidpi.ts) only sets the backing-store resolution
       (width/height attributes) for crispness — it never touches the CSS size,
       so it can't feed back into Phaser's parent measurement. !important guards
       against any inline size Phaser may set. */
    #game canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
