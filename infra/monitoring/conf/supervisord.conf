[supervisord]
nodaemon=true
logfile=/var/log/monitoring/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

; ------------------------------------------------------------------------------
; Prometheus — metrics scraper, bound to 127.0.0.1:9090 (container-internal only)
; ------------------------------------------------------------------------------
[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/monitoring/prometheus --storage.tsdb.retention.time=7d --web.listen-address=127.0.0.1:9090 --web.enable-lifecycle
user=9090
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/monitoring/prometheus.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/monitoring/prometheus.log
stderr_logfile_maxbytes=10MB
stopsignal=TERM
stopwaitsecs=10

; ------------------------------------------------------------------------------
; Grafana — dashboard UI, listens on MONITORING_PORT (default 3001)
; GF_* env vars are exported by entrypoint.sh and inherited here.
; supervisord's environment= key ADDS to the inherited env, not replaces it.
; ------------------------------------------------------------------------------
[program:grafana]
command=/run.sh
environment=GF_PATHS_PROVISIONING=/etc/grafana/provisioning
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/monitoring/grafana.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/monitoring/grafana.log
stderr_logfile_maxbytes=10MB
stopsignal=TERM
stopwaitsecs=30
