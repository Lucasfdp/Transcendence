apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus # Stable UID — referenced in all dashboard JSONs
      url: http://127.0.0.1:9090
      isDefault: true
      access: proxy
      editable: false
      jsonData:
          # Mirrors the default PROMETHEUS_SCRAPE_INTERVAL (see .env.example
          # and prometheus.yml.tpl). If that env var is changed, update this
          # too — Grafana's min-interval isn't derived from it automatically.
          timeInterval: "15s"
          httpMethod: POST
