# ==============================================================================
# ft_transcendence — Redis Configuration
# ==============================================================================
# This file is copied into the container at /etc/redis/redis.conf
# and passed to redis-server on startup.
#
# The password is injected at runtime via the entrypoint script
# (it reads $REDIS_PASSWORD and writes requirepass dynamically).
# ==============================================================================

# Bind to all interfaces inside the container (Docker networking handles isolation)
bind 0.0.0.0

# Port
port 6379

# Password — set dynamically by entrypoint.sh from $REDIS_PASSWORD
# requirepass <set_by_entrypoint>

# --------------------------------------------------------------------------
# Persistence — RDB snapshots
# --------------------------------------------------------------------------
# Save a snapshot if at least N keys changed in M seconds.
# Comment these out to disable RDB (pure in-memory, no persistence).
save 900 1
save 300 10
save 60  10000

# RDB file location
dir /data
dbfilename dump.rdb

# --------------------------------------------------------------------------
# Persistence — Append-Only File (AOF)
# --------------------------------------------------------------------------
# AOF provides stronger durability at the cost of more disk I/O.
# Enable this if session or queue data must survive a crash.
# appendonly yes
# appendfilename "appendonly.aof"
# appendfsync everysec

# --------------------------------------------------------------------------
# Memory management
# --------------------------------------------------------------------------
# maxmemory is injected by entrypoint.sh from $REDIS_MAX_MEMORY
# maxmemory 256mb

# Eviction policy when maxmemory is reached
# maxmemory-policy allkeys-lru

# --------------------------------------------------------------------------
# Security
# --------------------------------------------------------------------------
# Disable dangerous commands in production
rename-command FLUSHALL  ""
rename-command FLUSHDB   ""
rename-command DEBUG     ""
rename-command CONFIG    "CONFIG_PROTECTED"
rename-command SHUTDOWN  ""

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
loglevel notice
logfile ""

# --------------------------------------------------------------------------
# Slow log
# --------------------------------------------------------------------------
# Log commands slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128
