# ==============================================================================
# ft_transcendence — Docker Compose
# ==============================================================================
# Version 3.9 is the minimum required by this project.
# All image builds are defined here; no pre-built images from Docker Hub
# should be used for the main services (42 project rule).
#
# SERVICE MAP
# ──────────────────────────────────────────────────────────────────────────────
#  reverse_proxy  → Nginx, terminates TLS, routes to frontend / backend
#  frontend       → SPA (React / Vue / Svelte / Vanilla — TBD)
#  backend        → API server (Django / FastAPI / Express / NestJS — TBD)
#  database       → PostgreSQL, internal only
#  redis          → Redis, internal only
#  monitoring     → Grafana / Prometheus stack placeholder
#  portainer      → Docker management UI (dev only, disable for evaluation)
# ==============================================================================

services:

  # ============================================================================
  # REVERSE PROXY — Nginx
  # ============================================================================
  # Responsibilities:
  #   - Terminate TLS (HTTPS only; HTTP redirects to HTTPS)
  #   - Route /          → frontend service
  #   - Route /api/      → backend service
  #   - Route /ws/       → backend WebSocket endpoint
  #   - Serve static assets (optional, can be handled by frontend instead)
  #
  # Future expansion:
  #   - Add /game/ route when a dedicated game service is introduced
  #   - Configure upstream load balancing if multiple backend replicas run
  #   - Integrate Certbot sidecar for Let's Encrypt certificate renewal
  # ============================================================================
  reverse_proxy:
    build:
      context: ./requirements/reverse_proxy
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_reverse_proxy
    image: ${COMPOSE_PROJECT_NAME}/reverse_proxy:latest
    restart: unless-stopped
    ports:
      # Only the reverse proxy is allowed to have exposed ports.
      # All other services communicate exclusively via Docker networks.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Nginx configuration (named volume — survives container restarts)
      - nginx_config:/etc/nginx/conf.d
      # SSL certificates — mount the generated certs here.
      # Replace with a bind mount to /etc/letsencrypt for production.
      - nginx_ssl:/etc/nginx/ssl:ro
      # Shared static assets (optional — frontend can also serve its own)
      - frontend_static:/var/www/html:ro
      # Centralised log storage
      - logs:/var/log/nginx
    networks:
      - frontend_network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ============================================================================
  # FRONTEND
  # ============================================================================
  # Technology placeholder — replace Dockerfile to switch framework:
  #   React (Vite)  │  Vue 3  │  Angular  │  Svelte  │  Vanilla JS + Webpack
  #
  # In production, the frontend compiles to static files which Nginx serves
  # directly. In development, the dev-server runs inside the container for
  # hot module replacement (HMR).
  #
  # The frontend reaches the backend only through the reverse proxy — it does
  # NOT have a direct network route to the backend service. This enforces the
  # single-entry-point pattern and simplifies CORS configuration.
  #
  # Future expansion:
  #   - Replace this service with a multi-stage build optimised for production
  #   - Add a CDN origin for static asset delivery at scale
  # ============================================================================
  frontend:
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile
      args:
        - FRONTEND_ENV=${FRONTEND_ENV:-development}
        - VITE_API_URL=${VITE_API_URL:-https://localhost/api}
    container_name: ${COMPOSE_PROJECT_NAME}_frontend
    image: ${COMPOSE_PROJECT_NAME}/frontend:latest
    restart: unless-stopped
    # NOTE: No ports are exposed externally — all traffic routes through Nginx.
    expose:
      - "${FRONTEND_PORT:-3000}"
    volumes:
      # Static output directory shared with Nginx
      - frontend_static:/app/dist
      # Log storage
      - logs:/var/log/frontend
    networks:
      # Frontend lives only on the frontend_network.
      # It cannot reach the database or redis directly.
      - frontend_network
    environment:
      - NODE_ENV=${FRONTEND_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-https://localhost/api}
      - REACT_APP_API_URL=${REACT_APP_API_URL:-https://localhost/api}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${FRONTEND_PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ============================================================================
  # BACKEND
  # ============================================================================
  # Technology placeholder — replace Dockerfile to switch framework:
  #   Django (Python)  │  FastAPI (Python)  │  Express (Node)
  #   NestJS (Node)    │  Spring Boot (Java) │  Go (net/http / Gin / Echo)
  #
  # The backend:
  #   - Connects to PostgreSQL via backend_network
  #   - Connects to Redis via backend_network
  #   - Is reached by the reverse proxy via frontend_network (shared with Nginx)
  #   - Never exposes ports directly to the host
  #
  # Future expansion:
  #   - Add CELERY_BROKER_URL when background tasks are needed
  #   - Add ELASTICSEARCH_URL for full-text search / game history indexing
  #   - Add AI_SERVICE_URL when an AI opponent service is introduced
  # ============================================================================
  backend:
    build:
      context: ./requirements/backend
      dockerfile: Dockerfile
      args:
        - BACKEND_ENV=${BACKEND_ENV:-development}
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    image: ${COMPOSE_PROJECT_NAME}/backend:latest
    restart: unless-stopped
    expose:
      - "${BACKEND_PORT:-8000}"
    volumes:
      - logs:/var/log/backend
    networks:
      # The backend sits on BOTH networks:
      #   - frontend_network: so Nginx can proxy to it
      #   - backend_network:  so it can reach database and redis
      - frontend_network
      - backend_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core
      - APP_ENV=${BACKEND_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-insecure_dev_secret}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost}
      # Database connection
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Redis connection
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET:-insecure_jwt_secret}
      - JWT_EXPIRY=${JWT_EXPIRY:-3600}
      # OAuth (42 bonus)
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID:-}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET:-}
      - FORTYTWO_CALLBACK_URL=${FORTYTWO_CALLBACK_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${BACKEND_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ============================================================================
  # DATABASE — PostgreSQL
  # ============================================================================
  # Uses official Postgres image as base (multi-stage is not as useful here).
  # The database is ONLY accessible inside backend_network.
  # It is NEVER accessible from frontend_network or the host.
  #
  # Persistence:
  #   Data is stored in a named volume (db_data).
  #   Run 'make fclean' to destroy the volume and start fresh.
  #
  # Backup strategy:
  #   - See docs/architecture.md for pg_dump / pg_restore notes
  #   - Consider adding a scheduled backup container in production
  #
  # Future expansion:
  #   - Add read-replica with streaming replication
  #   - Add pgBouncer connection pooler as a sidecar
  # ============================================================================
  database:
    build:
      context: ./requirements/database
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_database
    image: ${COMPOSE_PROJECT_NAME}/database:latest
    restart: unless-stopped
    # SECURITY: database is NOT exposed on any host port.
    # If you need direct access during development, use:
    #   docker compose exec database psql -U $POSTGRES_USER $POSTGRES_DB
    volumes:
      # Persistent database storage — survives container restarts
      - db_data:/var/lib/postgresql/data
      # Initialisation SQL scripts (run once on first boot)
      - logs:/var/log/postgresql
    networks:
      # Database lives exclusively on backend_network.
      # The frontend and reverse_proxy cannot reach it.
      - backend_network
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ============================================================================
  # REDIS
  # ============================================================================
  # Redis is a fast in-memory data store used for:
  #   1. Session storage         — JWT blocklist / user sessions
  #   2. Caching                 — query results, computed game state
  #   3. Pub/Sub                 — WebSocket message broker
  #   4. Rate limiting           — per-IP or per-user request throttling
  #   5. Matchmaking queues      — lobby / tournament player queues
  #   6. WebSocket state         — live game room participant lists
  #
  # Redis is ONLY accessible from backend_network.
  # It is NEVER exposed on a host port.
  #
  # Future expansion:
  #   - Add Redis Sentinel for high-availability
  #   - Add Redis Cluster for horizontal sharding
  # ============================================================================
  redis:
    build:
      context: ./requirements/redis
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    image: ${COMPOSE_PROJECT_NAME}/redis:latest
    restart: unless-stopped
    expose:
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_MAX_MEMORY=${REDIS_MAX_MEMORY:-256mb}
      - REDIS_MAX_MEMORY_POLICY=${REDIS_MAX_MEMORY_POLICY:-allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ============================================================================
  # MONITORING
  # ============================================================================
  # Placeholder for observability stack.
  #
  # Planned integration:
  #   - Prometheus  → scrapes /metrics endpoints from all services
  #   - Grafana     → dashboards for latency, throughput, error rates
  #   - Loki        → log aggregation (replace json-file log driver)
  #   - Alertmanager→ route alerts to Slack / email / PagerDuty
  #   - Node Exporter → host-level CPU / memory / disk metrics
  #
  # For the MVP, this container runs a lightweight health dashboard.
  # Replace the Dockerfile to bring in the full Prometheus + Grafana stack.
  #
  # Security note:
  #   Grafana should be password-protected and ideally placed behind Nginx.
  #   Do NOT expose Prometheus externally in production.
  # ============================================================================
  monitoring:
    build:
      context: ./requirements/monitoring
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_monitoring
    image: ${COMPOSE_PROJECT_NAME}/monitoring:latest
    restart: unless-stopped
    expose:
      - "${MONITORING_PORT:-3000}"
    volumes:
      - monitoring_data:/var/lib/monitoring
      - logs:/var/log/monitoring
    networks:
      # Monitoring needs access to scrape metrics from all services,
      # so it sits on both networks. Restrict this if security is a concern.
      - frontend_network
      - backend_network
    environment:
      - GF_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - PROMETHEUS_SCRAPE_INTERVAL=${PROMETHEUS_SCRAPE_INTERVAL:-15s}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${MONITORING_PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ============================================================================
  # PORTAINER — Docker Management UI
  # ============================================================================
  # DEVELOPMENT / DEBUGGING ONLY.
  #
  # Portainer provides a web UI for inspecting containers, volumes, networks,
  # and logs without needing the Docker CLI.
  #
  # 42 EVALUATION NOTE:
  #   Portainer is NOT required for deployment or functionality.
  #   To disable it, comment out this entire service block before running
  #   'make up'. The project must work without Portainer.
  #
  # Security warning:
  #   Portainer has full Docker socket access. NEVER expose it publicly.
  #   Restrict the PORTAINER_PORT firewall rule to localhost only in production.
  # ============================================================================
  portainer:
    build:
      context: ./requirements/portainer
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_portainer
    image: ${COMPOSE_PROJECT_NAME}/portainer:latest
    restart: unless-stopped
    ports:
      # Portainer is the only service besides Nginx allowed to have a host port.
      # Set PORTAINER_PORT=0 or comment this block out to disable external access.
      - "${PORTAINER_PORT:-9443}:9443"
    volumes:
      # Docker socket — required for Portainer to manage containers
      # WARNING: Granting socket access is equivalent to root on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://localhost:9443/api/status", "--no-check-certificate"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

