# ==============================================================================
# NETWORKS
# ==============================================================================
# Two isolated networks enforce the security perimeter:
#
#  frontend_network:
#    Members: reverse_proxy, frontend, backend, monitoring, portainer
#    Purpose: Traffic that originates from or terminates at the browser.
#    The reverse proxy is the ONLY entry point from the outside world.
#
#  backend_network:
#    Members: backend, database, redis, monitoring
#    Purpose: Internal service communication.
#    The database and redis are NEVER reachable from frontend_network.
#
# Network isolation benefits:
#   - A compromised frontend container cannot query the database directly.
#   - Redis is invisible to Nginx and the browser.
#   - The attack surface is minimised by design.
# ==============================================================================

networks:

  frontend_network:
    name: ${COMPOSE_PROJECT_NAME}_frontend_network
    driver: bridge
    # Use custom subnet to avoid conflicts with host network ranges.
    # Adjust if 172.20.0.0/24 is already in use on your system.
    ipam:
      config:
        - subnet: 172.20.0.0/24

  backend_network:
    name: ${COMPOSE_PROJECT_NAME}_backend_network
    driver: bridge
    # internal: true would prevent any internet egress from this network.
    # Enable it once the backend no longer needs to reach external APIs.
    # internal: true
    ipam:
      config:
        - subnet: 172.20.1.0/24

# ==============================================================================
# VOLUMES
# ==============================================================================
# Named volumes persist data beyond the container lifecycle.
# Use 'make fclean' to destroy all volumes (warning: deletes all stored data).
#
# Volume descriptions:
#   db_data        — PostgreSQL PGDATA directory (tables, indexes, WAL files)
#   redis_data     — Redis RDB / AOF persistence files
#   nginx_config   — Nginx vhost configuration (editable without rebuild)
#   nginx_ssl      — TLS certificate and private key files
#   frontend_static— Compiled static assets served by Nginx
#   logs           — Shared log directory for all services
#   monitoring_data— Grafana / Prometheus time-series data
#   portainer_data — Portainer configuration and credentials database
# ==============================================================================

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME}_db_data

  redis_data:
    name: ${COMPOSE_PROJECT_NAME}_redis_data

  nginx_config:
    name: ${COMPOSE_PROJECT_NAME}_nginx_config

  nginx_ssl:
    name: ${COMPOSE_PROJECT_NAME}_nginx_ssl

  frontend_static:
    name: ${COMPOSE_PROJECT_NAME}_frontend_static

  logs:
    name: ${COMPOSE_PROJECT_NAME}_logs

  monitoring_data:
    name: ${COMPOSE_PROJECT_NAME}_monitoring_data

  portainer_data:
    name: ${COMPOSE_PROJECT_NAME}_portainer_data

  # Uncomment when adding the Elasticsearch bonus service:
  # elasticsearch_data:
  #   name: ${COMPOSE_PROJECT_NAME}_elasticsearch_data
