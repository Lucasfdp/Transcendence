# ==============================================================================
# Shell Smash — Development Hot-Reload Override
# ==============================================================================
# Loaded automatically by Docker Compose alongside docker-compose.yml.
# DO NOT commit secrets here. DO NOT use this file in production.
#
# FRONTEND — Vite HMR dev server
#   Access at:  http://localhost:3000  (direct — HMR WebSocket works natively)
#   API calls:  proxied to backend:8000 by Vite's built-in proxy (vite.config.js)
#   Live reload: edit anything in frontend/ or public/
#
# BACKEND — NestJS watch mode  (nest start --watch)
#   Live reload: edit anything in backend/src/
#   TypeScript is recompiled and the server restarted automatically on save.
#
# Usage:
#   make up        (override is picked up automatically)
#   make re        (rebuild + override)
#
# To run WITHOUT the override (production-like):
#   docker compose -f docker-compose.yml up --build
# ==============================================================================

services:
    # ── Frontend: Vite HMR ─────────────────────────────────────────────────────
    # Uses the builder stage (has Vite + all devDependencies).
    # The whole Vite project is bind-mounted, with node_modules kept in a
    # container-owned volume so the host tree can stay clean.
    frontend:
        build:
            target: builder
        image: ${COMPOSE_PROJECT_NAME}/frontend-dev:local
        working_dir: /app/frontend
        volumes:
            - ./frontend:/app/frontend
            - ./public:/app/public
            - /app/frontend/node_modules
        command: npm run dev -- --host 0.0.0.0
        ports:
            - "3000:3000" # Expose directly so the browser's HMR WebSocket works
        environment:
            - NODE_ENV=development
            - VITE_API_URL=/api # Relative path — Vite proxies this to backend:8000
        # The builder stage has no wget; use node for the health probe instead.
        healthcheck:
            test:
                - "CMD"
                - "node"
                - "-e"
                - "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    # ── Backend: NestJS watch mode ─────────────────────────────────────────────
    # Uses the builder stage (has @nestjs/cli, ts-node, all devDependencies).
    # Only src/ is bind-mounted so node_modules stays intact.
    backend:
        build:
            target: builder
        image: ${COMPOSE_PROJECT_NAME}/backend-dev:local
        volumes:
            - ./backend/src:/build/src # TypeScript source
        working_dir: /build
        entrypoint: [] # Clear the runtime entrypoint.sh
        command:
            - sh
            - -lc
            - |
                i=0
                until [ -f /vault/secrets/backend.env ] || [ "$$i" -ge "${SECRETS_WAIT_TIMEOUT:-120}" ]; do
                  i=$$(($$i + 1))
                  sleep 1
                done
                [ -f /vault/secrets/backend.env ] || { echo "[backend] Missing /vault/secrets/backend.env" >&2; exit 1; }
                set -a
                . /vault/secrets/backend.env
                set +a
                npm run start:dev
        environment:
            - NODE_ENV=development
            - APP_ENV=development
        # The builder stage has no wget; use node for the health probe instead.
        healthcheck:
            test:
                - "CMD"
                - "node"
                - "-e"
                - "require('http').get('http://localhost:8000/api/health', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 40s
