# SonarCloud analysis configuration
# Docs: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=transcendence
sonar.organization=your-org-slug

# ── Source roots ──────────────────────────────────────────────────────────────
sonar.sources=backend/src,frontend/src

# ── Exclusions ────────────────────────────────────────────────────────────────
# node_modules and build artefacts contain third-party code — not our issues.
# *.spec.ts files are test files — counted separately via coverage reports.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/coverage/**

# ── Test sources ──────────────────────────────────────────────────────────────
sonar.tests=backend/src
sonar.test.inclusions=**/*.spec.ts

# ── Coverage ──────────────────────────────────────────────────────────────────
# Jest outputs lcov to coverage/lcov.info — consumed by SonarCloud for line coverage.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# ── Language ──────────────────────────────────────────────────────────────────
sonar.language=ts
