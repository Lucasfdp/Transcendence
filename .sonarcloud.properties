# SonarCloud analysis configuration
# Docs: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=transcendence
sonar.organization=your-org-slug

# ── Source roots ──────────────────────────────────────────────────────────────
sonar.sources=backend/src,frontend/src

# ── Exclusions ────────────────────────────────────────────────────────────────
# node_modules and build artefacts contain third-party code — not our issues.
# Backend specs (*.spec.ts) and frontend tests (*.test.ts[x]) are test files —
# counted separately via coverage reports, not as production source.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/src/test/**,**/coverage/**

# ── Test sources ──────────────────────────────────────────────────────────────
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# ── Coverage ──────────────────────────────────────────────────────────────────
# Jest (backend) and Vitest (frontend) each output lcov to coverage/lcov.info —
# both consumed by SonarCloud for line coverage.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# ── Language ──────────────────────────────────────────────────────────────────
sonar.language=ts
